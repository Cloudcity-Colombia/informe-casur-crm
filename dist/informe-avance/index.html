<style>
*{box-sizing:border-box}

<body>
<div class="stripe"><i style="flex:2;background:#FDC603"></i><i style="flex:1;background:#223A7A"></i><i style="flex:1;background:#D70E27"></i></div>
<main class="card">
  <div class="plate"><img class="a" src="casur-caja.png" alt="CASUR — Caja de Sueldos de Retiro de la Policía Nacional"><i></i><img class="b" src="cloudcity.png" alt="Cloud City Software Factory"></div>
    <p class="eyebrow">Caja de Sueldos de Retiro de la Policía Nacional</p>
  <h1>Informe de avance CRM 360<b></b></h1>
  <p class="sub">Esta presentación es de acceso restringido. Ingresa la contraseña que te compartió Cloud City Colombia.</p>
  <form id="f" autocomplete="off">
    <label for="p">Contraseña</label>
    <div class="row"><input id="p" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus><button id="b" type="submit">Entrar</button></div>
    <p class="err" id="e" role="alert"></p>
  </form>
  <noscript><p>Se necesita JavaScript para abrir la presentación.</p></noscript>
  <p class="foot">Cloud City Colombia S.A.S. · Corte 27 de octubre de 2026</p>
</main>
<script>
(function(){
var P=null,f=document.getElementById("f"),i=document.getElementById("p"),b=document.getElementById("b"),e=document.getElementById("e");
async function load(){if(!P){var r;try{r=await fetch("payload.bin",{cache:"no-cache"})}catch(_){throw new Error("net")}if(!r.ok)throw new Error("net");P=new Uint8Array(await r.arrayBuffer())}return P}
async function open(pw){
  var raw=await load(),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  var html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  try{sessionStorage.setItem("lh-k-avance",pw)}catch(_){}
  document.open();document.write(html);document.close();
}
async function go(pw,silent){
  if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){e.textContent="Tu navegador no es compatible. Usa una versión reciente de Chrome, Safari o Firefox.";return}
  b.disabled=true;e.textContent=silent?"":"Verificando…";
  try{await open(pw)}catch(x){
    b.disabled=false;
    if(silent){e.textContent="";return}
    e.textContent=(x&&x.message==="net")?"No se pudo cargar la presentación. Revisa tu conexión e inténtalo de nuevo.":"Contraseña incorrecta.";i.select();
    f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
  }
}
f.addEventListener("submit",function(ev){ev.preventDefault();if(i.value)go(i.value,false)});
try{var s=sessionStorage.getItem("lh-k-avance");if(s)go(s,true)}catch(_){}
})();
</script>
